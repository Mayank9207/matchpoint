name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
      timezone: "Asia/Kolkata"


jobs:
  engine-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11
          python -m pip install numpy ortools pytest pytest-benchmark
          python -m pip install -r engine/backend/requirements.txt
          python -m pip install pytest-asyncio

      - name: Build C++ extension
        run: |
          cmake -S engine/cpp -B engine/cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build engine/cpp/build --parallel

      - name: Run engine tests
        working-directory: engine
        run: python -m pytest -q --ignore=backend

  backend-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: matchpoint_ci
      JWT_SECRET: ci-dummy-secret-not-a-real-key
      ENABLE_WORKER: "false"
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_FROM: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11
          python -m pip install numpy ortools pytest pytest-benchmark
          python -m pip install -r engine/backend/requirements.txt
          python -m pip install pytest-asyncio

      - name: Build C++ extension
        run: |
          cmake -S engine/cpp -B engine/cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build engine/cpp/build --parallel

      - name: Run backend tests
        working-directory: engine/backend
        run: python -m pytest -q
